[package]
name = "esp-rs-copro"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"

[profile.release]
panic = 'abort'

[package.metadata.docs.rs]
features = ["is-lp-core", "has-lp-core", "esp32c6", "esp32s3", "move_on_need"]

[dependencies]
esp-println = { workspace = true, optional = true }
esp-lp-hal = { workspace = true, optional = true }
esp-hal = { workspace = true, optional = true }

[dev-dependencies]
esp-rs-copro-procmacro = { path = "../esp-rs-copro-procmacro", features=[] }
rand = "0.10.0"

[features]
default = []
nottest = []
is-lp-core = ["dep:esp-lp-hal", "nottest"]
has-lp-core = ["dep:esp-println", "dep:esp-hal", "nottest"]
esp32c6 = ["esp-lp-hal?/esp32c6", "esp-hal?/esp32c6", "esp-println?/esp32c6"]
esp32s3 = ["esp-lp-hal?/esp32s3", "esp-hal?/esp32s3", "esp-println?/esp32s3"]
custom_range = []
move_on_need = []
