[package]
edition      = "2024"
name         = "music-main"
version      = "0.1.0"

[[bin]]
name = "music-main"
path = "./src/bin/main.rs"

[dependencies]
esp-println.workspace = true
esp-backtrace.workspace = true
esp-bootloader-esp-idf.workspace = true
esp-hal.workspace = true
esp-rs-copro           = { path = "../../../esp-rs-copro", features = ["has-lp-core"] }
esp-rs-copro-procmacro = { path = "../../../esp-rs-copro-procmacro" , features = ["has-lp-core"] }

critical-section.workspace = true
esp-alloc.workspace = true

music-shared = { path = "../shared" }

[features]
esp32c6 = [ "esp-backtrace/esp32c6", "esp-bootloader-esp-idf/esp32c6", "esp-hal/esp32c6", "esp-rs-copro/esp32c6", "esp-alloc/esp32c6", "esp-rs-copro-procmacro/esp32c6" ]
esp32s3 = [ "esp-backtrace/esp32s3", "esp-bootloader-esp-idf/esp32s3", "esp-hal/esp32s3", "esp-rs-copro/esp32s3", "esp-alloc/esp32s3", "esp-rs-copro-procmacro/esp32s3" ]

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
