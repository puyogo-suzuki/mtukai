[package]
name = "temp-sensor-lp"
version = "0.1.0"
edition = "2024"

[dependencies]
esp-lp-hal = { workspace = true, features = ["esp32c6"]}

embedded-hal.workspace = true
cfg-if.workspace = true
panic-halt.workspace = true

esp-rs-copro = { path = "../../../esp-rs-copro", features=["is-lp-core", "esp32c6"] }
esp-rs-copro-procmacro = { path = "../../../esp-rs-copro-procmacro", features=["is-lp-core", "esp32c6"] }

temp-sensor-shared = { path = "../shared" }

[profile.dev]
opt-level = 's'

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false