[package]
edition      = "2024"
name         = "pedometer-main"
version      = "0.1.0"

[[bin]]
name = "pedometer-main"
path = "./src/bin/main.rs"

[dependencies]
esp-println.workspace = true
esp-backtrace          = { workspace = true, features = ["esp32c6"] }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32c6"] }
esp-hal                = { workspace = true, features = ["esp32c6", "unstable", "log-04"] }
esp-rs-copro           = { path = "../../../esp-rs-copro", features = ["has-lp-core", "esp32c6"] }
esp-rs-copro-procmacro = { path = "../../../esp-rs-copro-procmacro" , features = ["has-lp-core", "esp32c6"] }

critical-section.workspace = true
esp-alloc = { workspace = true, features = ["esp32c6"] }

pedometer-shared = { path = "../shared" }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
